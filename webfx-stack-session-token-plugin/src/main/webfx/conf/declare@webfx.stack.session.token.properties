# Signing keys for the token that carries a caller's identity back to this server.
#
# The server hands a client a signed statement of who it is and reads it back on every message.
# With no key here nothing can be minted and nothing verifies: mint() throws rather than issuing an
# unprotected token, so a misconfigured server refuses to issue identities instead of issuing
# worthless ones.
#
# Generate one as 32 random bytes, base64 encoded. It is a SECRET — anyone holding it can mint a
# token for any user — so it belongs in the deployment's gitignored secret variables file, never in
# a tracked file and never in this repository. See docs/operations/agent-credential-isolation-runbook.md
# for where that lives and who may handle it.
signingKey = ${{ SESSION_TOKEN_SIGNING_KEY | '' }}

# The key being retired, during a rotation. Set this to the OLD value when you put a new one in
# signingKey: tokens already in the wild keep verifying until they expire, so a rotation does not
# sign everyone out at once — which is what makes rotations something that actually get done.
# Clear it once the longest possible token lifetime has passed since the change.
previousSigningKey = ${{ SESSION_TOKEN_PREVIOUS_SIGNING_KEY | '' }}
